# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung)
#       python run.py simulate         (50 phiên — bản nộp CP4)

sessions: 50
seed: 42

users:
  low: 5
  base: 30
  high: 150
  source: "(tự ước tính) 3 quy mô cơ sở y tế tại VN: Thấp = 1 phòng khám nội khoa (5 BS); Cơ sở = 1 bệnh viện tuyến quận/huyện (30 BS nội khoa); Cao = chuỗi phòng khám / bệnh viện lớn (150 BS)"

personas:
  - name: bac_si_phong_kham_nho
    share: 0.50
    uses_per_month: 60
    turns_per_session: 1
    types: [thuong, kho]
    source: "(tự ước tính) bác sĩ phòng khám nhỏ, ~2-3 ca cần rà tương tác/ngày làm việc"
  - name: bac_si_noi_tong_quat
    share: 0.35
    uses_per_month: 150
    turns_per_session: 1
    types: [thuong, kho]
    source: "(tự ước tính) bác sĩ nội tổng quát ngoại trú, ~6-7 ca/ngày làm việc"
  - name: bac_si_chuyen_khoa_dong_benh
    share: 0.15
    uses_per_month: 300
    turns_per_session: 2
    types: [thuong, kho]
    source: "(tự ước tính) bác sĩ chuyên khoa đông bệnh nhân đa bệnh lý, ~12-15 ca/ngày, thường rà lại 2 lượt/ca"

prices:
